<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ドル円 IFDOCO計算</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#14212b;--sub:#5d6b76;--line:#d5dde3;--acc:#0d5c63;--ok:#1a7f4b;--ng:#c0392b;--wn:#a86a00}
@media (prefers-color-scheme:dark){:root{--bg:#0f171d;--card:#18232b;--ink:#e6edf1;--sub:#95a4af;--line:#2b3a45;--acc:#5cc6cf;--ok:#4cc38a;--ng:#ff7b6b;--wn:#e8b04a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--sub)}
input,select{width:100%;font-size:17px;padding:9px;margin-top:3px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;padding:10px;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px}
.seg button.on{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0}
.p{color:var(--ok)}.l{color:var(--ng)}
.msg{font-size:14px;padding:6px 0}
.msg.ng{color:var(--ng)}.msg.ok{color:var(--ok)}.msg.wn{color:var(--wn)}
.note{font-size:12px;color:var(--sub)}
textarea{width:100%;height:150px;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.cp{width:100%;padding:11px;margin-top:8px;font-size:15px;background:var(--acc);color:var(--bg);border:0;border-radius:6px;font-weight:700}
</style></head>
<body><main>
<h1>ドル円 IFDOCO計算</h1>

<section><h2>現在価格・口座</h2>
<div class="g">
<label>買価格 Ask<input id="ask" type="number" step="0.001" inputmode="decimal" value="157.417"></label>
<label>売価格 Bid<input id="bid" type="number" step="0.001" inputmode="decimal" value="157.379"></label>
<label>口座残高（円）<input id="bal" type="number" inputmode="numeric" value="100000"></label>
<label>数量（万通貨）<input id="lot" type="number" step="0.1" inputmode="decimal" value="1"></label>
</div></section>

<section><h2>注文内容</h2>
<div class="seg"><button id="bBuy" class="on">買い</button><button id="bSell">売り</button></div>
<div class="g">
<label>注文方式<select id="type"><option value="limit">指値</option><option value="stop">逆指値</option><option value="market">成行</option></select></label>
<label>新規価格<input id="ent" type="number" step="0.001" inputmode="decimal" value="156.95"></label>
<label>利益確定<input id="tp" type="number" step="0.001" inputmode="decimal" value="157.50"></label>
<label>損切り<input id="sl" type="number" step="0.001" inputmode="decimal" value="156.60"></label>
</div></section>

<section><h2>チェック</h2><div id="chk"></div></section>
<section><h2>結果（1pip＝100円／1万通貨）</h2><div id="res"></div>
<p class="note">損益はスプレッド前の価格差で計算しています。約定価格は数pipsずれることがあります。</p></section>

<section><h2>コピー用</h2><textarea id="out" readonly></textarea>
<button class="cp" id="cp">コピーする</button></section>
</main>
<script>
const $=id=>document.getElementById(id);
let side='buy';
const f=(n,d=3)=>n.toFixed(d);
const y=n=>Math.round(n).toLocaleString('ja-JP')+'円';
function set(s){side=s;$('bBuy').classList.toggle('on',s==='buy');$('bSell').classList.toggle('on',s==='sell');calc()}
$('bBuy').onclick=()=>set('buy');$('bSell').onclick=()=>set('sell');
['ask','bid','bal','lot','type','ent','tp','sl'].forEach(i=>$(i).addEventListener('input',calc));
function calc(){
 const ask=+$('ask').value,bid=+$('bid').value,bal=+$('bal').value,lot=+$('lot').value||0,type=$('type').value;
 const buy=side==='buy';
 const mk=buy?ask:bid;
 $('ent').disabled=type==='market';
 if(type==='market')$('ent').value=mk;
 const ent=+$('ent').value,tp=+$('tp').value,sl=+$('sl').value;
 const msgs=[];const add=(c,t)=>msgs.push([c,t]);
 let bad=false;
 if(!ask||!bid||!ent||!tp||!sl){$('chk').innerHTML='<div class="msg wn">すべての価格を入力してください</div>';$('res').innerHTML='';$('out').value='';return}
 if(ask<=bid){add('ng','AskがBid以下です。価格を確認してください');bad=true}
 if(type==='limit'){
  if(buy&&ent>=ask){add('ng','買い指値は現在のAsk('+f(ask)+')より低くしてください');bad=true}
  if(!buy&&ent<=bid){add('ng','売り指値は現在のBid('+f(bid)+')より高くしてください');bad=true}
 }else if(type==='stop'){
  if(buy&&ent<=ask){add('ng','買い逆指値は現在のAsk('+f(ask)+')より高くしてください');bad=true}
  if(!buy&&ent>=bid){add('ng','売り逆指値は現在のBid('+f(bid)+')より低くしてください');bad=true}
 }
 if(buy){
  if(tp<=ent){add('ng','買いの利益確定は新規価格より上にしてください');bad=true}
  if(sl>=ent){add('ng','買いの損切りは新規価格より下にしてください');bad=true}
 }else{
  if(tp>=ent){add('ng','売りの利益確定は新規価格より下にしてください');bad=true}
  if(sl<=ent){add('ng','売りの損切りは新規価格より上にしてください');bad=true}
 }
 const pp=(buy?tp-ent:ent-tp)*100, lp=(buy?ent-sl:sl-ent)*100;
 const spread=(ask-bid)*100;
 if(!bad){
  add('ok','価格の関係に矛盾はありません');
  if(type!=='market'){const d=buy?(type==='limit'?ask-ent:ent-ask):(type==='limit'?ent-bid:bid-ent);add('wn','現在価格から新規価格まで約'+f(d*100,1)+'pips。届かないと約定しません')}
  if(lp>0&&pp/lp<1)add('wn','リスクリワードが1未満です');
 }
 $('chk').innerHTML=msgs.map(m=>'<div class="msg '+m[0]+'">'+m[1]+'</div>').join('');
 if(bad||pp<=0||lp<=0){$('res').innerHTML='<div class="msg wn">エラーを直すと結果が出ます</div>';$('out').value='';return}
 const pr=pp*100*lot, ls=lp*100*lot, rr=pp/lp;
 const needTp=buy?tp+spread/100:tp-spread/100;
 const needSl=buy?sl+spread/100:sl-spread/100;
 const rows=[
  ['想定利益','<b class="p">'+f(pp,1)+'pips／'+y(pr)+'</b>'],
  ['想定損失','<b class="l">'+f(lp,1)+'pips／'+y(ls)+'</b>'],
  ['リスクリワード','<b>1：'+f(rr,2)+'</b>'],
  ['損失の残高比','<b>'+(bal?f(ls/bal*100,1)+'%':'-')+'</b>'],
  ['利確に必要な'+(buy?'Ask':'Bid')+'(約)','<b>'+f(needTp)+'</b>'],
  ['損切りに必要な'+(buy?'Ask':'Bid')+'(約)','<b>'+f(needSl)+'</b>']
 ];
 $('res').innerHTML=rows.map(r=>'<div class="row"><span>'+r[0]+'</span>'+r[1]+'</div>').join('');
 const tn={limit:'指値',stop:'逆指値',market:'成行'}[type];
 $('out').value='方向：'+(buy?'買い':'売り')+'\n新規注文：'+tn+' '+f(ent)+'\n利益確定：'+f(tp)+'\n損切り：'+f(sl)+'\n想定利益：'+f(pp,1)+'pips／'+y(pr)+'\n想定損失：'+f(lp,1)+'pips／'+y(ls)+'\nリスクリワード：1：'+f(rr,2);
}
$('cp').onclick=async()=>{
 const t=$('out').value;if(!t)return;
 try{await navigator.clipboard.writeText(t);$('cp').textContent='コピーしました'}
 catch(e){$('out').select();$('cp').textContent='選択しました。長押しでコピーしてください'}
 setTimeout(()=>$('cp').textContent='コピーする',2000);
};
calc();
</script></body></html>
